<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Daily Dash</title>
  <meta name="description" content="A calm personal daily planner page.">
  <meta name="theme-color" content="#faf6ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1f1e24" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Daily Dash">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="css/style.css">
  <script>
    /* Apply saved theme before first paint so there is no flash. */
    try { var t = localStorage.getItem('dd:theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div id="banner" class="banner" hidden></div>
  <main id="app" aria-live="polite"></main>
  <nav id="nav" class="nav" aria-label="Main"></nav>

  <!-- Order matters: each file only uses the ones above it. -->
  <script src="js/config.js"></script>
  <script src="js/defaults.js"></script>
  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/habits.js"></script>
  <script src="js/matrix.js"></script>
  <script src="js/day.js"></script>
  <script src="js/pages/today.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/matrix.js"></script>
  <script src="js/pages/goals.js"></script>
  <script src="js/pages/meals.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
